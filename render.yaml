services:
  # ─────────────────────────────────────────────────────────────────────────────
  # ServiceDesk Pro — Backend API (Express + Mongoose + Socket.IO)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: servicedesk-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SERVER_URL
        value: https://servicedesk-api.onrender.com
      # Set CLIENT_URL to your Vercel (or Render) frontend domain:
      - key: CLIENT_URL
        value: https://servicedesk-pro.vercel.app
      # Provide your MongoDB Atlas connection string:
      - key: MONGO_URI
        sync: false
      # Production JWT secrets generated automatically by Render:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 10
      - key: DEMO_MODE
        value: false
      - key: DEMO_BANNER
        value: false
      - key: BUSINESS_TIMEZONE
        value: Asia/Kolkata
      - key: SLA_MONITOR_INTERVAL_SECONDS
        value: 60
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: AI_ENABLED
        value: true
      # Optional: Google Gemini API key for AI ticket classification
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false

  # ─────────────────────────────────────────────────────────────────────────────
  # ServiceDesk Pro — Optional Frontend Static Site on Render
  # (Use this if hosting frontend on Render; otherwise host on Vercel)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: servicedesk-web
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --workspace client
    staticPublishPath: client/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: servicedesk-api
          property: host
