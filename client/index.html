<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="ServiceDesk Pro — AI-powered IT helpdesk, SLA and asset intelligence platform."
    />
    <title>ServiceDesk Pro</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Inter is a progressive enhancement; the font stack in tailwind.config.js
         falls back to system UI fonts when the network is unavailable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <script>
      // Resolve the persisted theme before first paint so the app never flashes
      // the wrong palette. Mirrors the logic in src/stores/ui.store.ts.
      (function () {
        try {
          var stored = localStorage.getItem('sdp.theme');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (err) {
          /* localStorage unavailable (private mode) — keep the light default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ServiceDesk Pro requires JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
